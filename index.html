<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С Днём Рождения!</title>
<style>
body { margin:0; padding:0; background: radial-gradient(circle, #ffbbff, #ff66cc, #aa0099); font-family: -apple-system, sans-serif; overflow: hidden; text-align: center; color: white; }
.card { position: relative; top: 15%; margin: auto; width:90%; max-width:400px; background: rgba(255,255,255,0.15); padding:25px; border-radius:20px; backdrop-filter: blur(8px); box-shadow:0 0 20px rgba(255,255,255,0.4); }
h1 { font-size:28px; margin-bottom:15px; }
p { font-size:18px; }
button { margin-top:20px; padding:10px 20px; font-size:18px; border:none; border-radius:12px; background:#ffffff55; color:white; cursor:pointer; }
canvas { position: fixed; top:0; left:0; z-index:-1; }
</style>
</head>
<body>

<canvas id="confetti"></canvas>
<canvas id="fireworks"></canvas>

<div class="card">
  <h1>Чмо, с днем рождения! Мае тынг фсмаер!</h1>
  <p>Ды дае самый тынг, ты дае мае туг, ме стаег, мае фарс, мае саер, дае сыжаен иу па</p>
  <button onclick="playMusic()">Включить музыку 🎵</button>
</div>

<audio id="birthday-music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>
// Музыка
function playMusic(){
  document.getElementById('birthday-music').play();
}

// Конфетти
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

class Confetti {
  constructor(){
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * -canvas.height;
    this.r = 5 + Math.random()*10;
    this.d = Math.random()*50;
    this.color = `hsl(${Math.random()*360},100%,60%)`;
    this.tilt = Math.random()*10 - 10;
    this.tiltAngleIncrement = Math.random()*0.07 + 0.05;
    this.tiltAngle = 0;
  }
  draw(){
    ctx.beginPath();
    ctx.lineWidth = this.r/2;
    ctx.strokeStyle = this.color;
    ctx.moveTo(this.x + this.tilt + this.r/4, this.y);
    ctx.lineTo(this.x + this.tilt, this.y + this.tilt + this.r/2);
    ctx.stroke();
  }
}

let confetti = [];
for(let i=0; i<150; i++) confetti.push(new Confetti());

function drawConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  confetti.forEach(c => {
    c.tiltAngle += c.tiltAngleIncrement;
    c.y += (Math.cos(c.d) + 3 + c.r/2)/2;
    c.tilt = Math.sin(c.tiltAngle) * 15;
    if(c.y > canvas.height) c.y = -10;
    c.draw();
  });
  requestAnimationFrame(drawConfetti);
}
drawConfetti();

// Фейерверки
const fw = document.getElementById('fireworks');
const fctx = fw.getContext('2d');
fw.width = window.innerWidth;
fw.height = window.innerHeight;
let fireworks = [];

class Firework {
  constructor(x,y){
    this.p = [];
    for(let i=0;i<50;i++){
      this.p.push({
        x: x, y: y,
        vx: (Math.random()-0.5)*6,
        vy: (Math.random()-0.5)*6,
        r: Math.random()*3+1,
        col: `hsl(${Math.random()*360},100%,60%)`
      });
    }
  }
  update(){
    this.p.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
    });
  }
  draw(){
    this.p.forEach(p => {
      fctx.beginPath();
      fctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      fctx.fillStyle = p.col;
      fctx.fill();
    });
  }
}

function launchFirework(){
  fireworks.push(new Firework(Math.random()*fw.width, Math.random()*fw.height/2));
}
setInterval(launchFirework, 800);

function drawFireworks(){
  fctx.clearRect(0,0,fw.width,fw.height);
  fireworks.forEach(fwk => { fwk.update(); fwk.draw(); });
  requestAnimationFrame(drawFireworks);
}
drawFireworks();
</script>

</body>
</html>
